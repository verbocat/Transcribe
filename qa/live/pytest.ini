[pytest]
testpaths = .
python_files = test_*.py
addopts = -ra -p no:cacheprovider -m "not exposure and not owndata and not paid and not email"
markers =
    smoke: unauthenticated health and reachability checks
    readonly: authenticated GETs of the test account's own data
    compute: stateless POSTs that only compute a response
    authz: requests without a token / with a bad token, expecting 401/403
    exposure: unauthenticated reads that currently return other users' data (opt-in)
    owndata: writes to data the test account owns or creates, restored or deleted afterwards (opt-in)
    paid: uploads and AI calls on a 21 s test clip; spends the test account's minutes and API credit (opt-in)
    email: sends real emails to the test account's own inbox through Brevo (opt-in)
    blocked: endpoints never sent on production (always skipped, shown for coverage)
    ui: browser checks of the live frontend (needs Playwright)
